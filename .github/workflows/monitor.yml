name: monitor
# 定时监控新着页 —— ⚠️ M1 实测（2026-09-10）：PCO 风控对自动化浏览器一律
# 「Restricted access」（Actions 数据中心 IP、本地家庭网络、headless 与有头
# Chromium 均被拒，详见主仓库 docs/PLAN-F9-CATALOG-IMPORT.md §5）。
# 在获得可行载体（如负责人工作机授权 + 真实浏览器方案）前暂停定时抓取，
# 避免无意义高频撞墙；保留 workflow_dispatch 供复验。
on:
  workflow_dispatch:
#  schedule:
#    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Grab new arrivals
        env:
          URLS: 'https://www.pokemoncenter-online.com/search/?srule=top-new-product'
        run: node monitor/grab.js
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-output
          path: out/
          retention-days: 14
