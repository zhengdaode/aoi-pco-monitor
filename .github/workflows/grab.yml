name: grab
# 按需抓取：手动触发，或由主仓库 Edge Function catalog-dispatch 转发（F9 M2）
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'PCO 页面 URL（多个用空格分隔）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Grab
        env:
          URLS: ${{ inputs.urls }}
        run: node monitor/grab.js
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grab-output
          path: out/
          retention-days: 14
